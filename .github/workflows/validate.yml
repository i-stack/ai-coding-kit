name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills-engineering/ios-engineer/**'
  push:
    branches: [main, feature_*]
    paths:
      - 'skills-engineering/ios-engineer/**'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ios-engineer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-engineering/ios-engineer

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep ruby > /dev/null

      - name: Audit Reference Freshness
        run: |
          STALE_MONTHS=12 CRITICAL_MONTHS=18 bash scripts/audit-ref-freshness.sh

      - name: Validate references and links
        run: bash ../scripts/validate-skill-structure.sh ios-engineer
